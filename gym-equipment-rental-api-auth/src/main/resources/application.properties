spring.application.name=gym-equipment-rental-api

# Server
server.port=8081

# PostgreSQL datasource - update credentials if yours differ
spring.datasource.url=jdbc:postgresql://localhost:5432/gym_equipment_rental_api_db
spring.datasource.username=postgres
spring.datasource.password=@Umubyeyi11
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Jackson - serialize LocalDate as yyyy-MM-dd instead of an array
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false

# RabbitMQ message broker for email/SMS notifications
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# JWT - set JWT_SECRET in your environment (IntelliJ run configuration). Must be at least 32 characters.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-to-a-long-random-string-123456}
app.jwt.expiration-minutes=480

# Frontend development origins
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,http://localhost:3000,http://127.0.0.1:3000
